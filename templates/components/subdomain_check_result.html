{% if result %}
  {% if result.is_valid %}
    <div id="subdomain-feedback" class="inline-flex items-center gap-2 rounded-lg border border-emerald-200 bg-emerald-50/90 px-3 py-2 text-xs sm:text-sm text-emerald-800 shadow-xs" role="status" aria-live="polite">
      <span class="flex h-5 w-5 shrink-0 items-center justify-center rounded-full bg-emerald-600 text-white" aria-hidden="true">
        <svg class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7" />
        </svg>
      </span>
      <span class="font-medium">
        Disponível: <strong class="font-bold text-emerald-950 underline decoration-emerald-400 decoration-2 underline-offset-2">{{ result.slug }}.coworkhub.com.br</strong>
      </span>
      <input type="hidden" name="validated_slug" value="{{ result.slug }}" id="validated_slug">
    </div>
  {% else %}
    <div id="subdomain-feedback" class="inline-flex items-center gap-2 rounded-lg border border-red-200 bg-red-50/90 px-3 py-2 text-xs sm:text-sm text-red-700 shadow-xs" role="alert" aria-live="assertive">
      <span class="flex h-5 w-5 shrink-0 items-center justify-center rounded-full bg-red-600 text-white" aria-hidden="true">
        <svg class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </span>
      <span class="font-medium">{{ result.error }}</span>
    </div>
  {% endif %}
{% else %}
  <div id="subdomain-feedback" class="flex items-center gap-2 text-xs sm:text-sm text-slate-500" aria-live="polite">
    <svg class="h-4 w-4 shrink-0 text-slate-400" aria-hidden="true" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
    </svg>
    <span>Digite o nome do seu coworking para checar a disponibilidade do endereço.</span>
  </div>
{% endif %}
