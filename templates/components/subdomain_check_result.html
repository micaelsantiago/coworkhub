{% if result %}
  {% if result.is_valid %}
    <div id="subdomain-feedback" class="mt-2.5 flex items-center gap-2 text-xs sm:text-sm text-emerald-700 animate-fadeIn" role="status">
      <svg class="h-4 w-4 shrink-0 text-emerald-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7" />
      </svg>
      <span>
        Disponível: <strong class="font-semibold text-emerald-900">{{ result.slug }}.coworkhub.com.br</strong>
      </span>
      <input type="hidden" name="validated_slug" value="{{ result.slug }}" id="validated_slug">
    </div>
  {% else %}
    <div id="subdomain-feedback" class="mt-2.5 flex items-center gap-2 text-xs sm:text-sm text-red-600 animate-fadeIn" role="alert">
      <svg class="h-4 w-4 shrink-0 text-red-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
      </svg>
      <span>{{ result.error }}</span>
    </div>
  {% endif %}
{% else %}
  <div id="subdomain-feedback" class="mt-2.5 text-xs text-black/50">
    Digite o nome do seu coworking para checar a disponibilidade do endereço.
  </div>
{% endif %}
